<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avstemning – Askerlia Boligsameie</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    text-align: center;
  }

  header {
    background: #1f3a5f;
    color: white;
    padding: 30px;
  }

  h1 {
    margin: 0;
  }

  .container {
    max-width: 600px;
    margin: 40px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }

  label {
    display: block;
    margin-top: 15px;
    text-align: left;
  }

  input, select {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  .button {
    margin-top: 25px;
    padding: 15px;
    width: 100%;
    background: #1f3a5f;
    color: white;
    border: none;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
  }

  .button:hover {
    background: #162c47;
  }

  .deadline {
    color: red;
    font-weight: bold;
    margin-top: 10px;
  }
</style>
</head>

<body>

<header>
  <h1>Avstemning – Farge på bygget</h1>
  <p>Askerlia Boligsameie</p>
</header>

<div class="container">

  <p>Velg hvilken farge du ønsker at bygget skal males i.</p>
  <p class="deadline">Frist: 1. juni</p>

  <form action="https://formsubmit.co/askerlia1@gmail.com" method="POST">

    <input type="hidden" name="_subject" value="Ny stemme – Askerlia">

    <label>Navn</label>
    <input type="text" name="Navn" required>

    <label>E-post</label>
    <input type="email" name="E-post" required>

    <label>Oppgang / Leilighet</label>
    <input type="text" name="Leilighet" required>

    <label>Velg farge</label>
    <select name="Fargevalg" required>
      <option value="">Velg alternativ</option>
      <option>Grønn</option>
      <option>Rød</option>
      <option>Gråblå</option>
      <option>Ingen av fargene</option>
    </select>

    <button class="button">Send stemme</button>

  </form>

</div>

</body>
</html>
