<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avstemning – Askerlia Boligsameie</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #2c3e50;
  color: white;
  text-align: center;
  padding: 40px 20px;
}

.logo {
  max-width: 300px;
  margin-bottom: 20px;
}

.container {
  max-width: 520px;
  margin: 40px auto;
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.12);
}

.deadline {
  color: red;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin: 8px 0 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
  box-sizing: border-box;
}

.color-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 10px 0 20px;
}

.color-btn {
  padding: 16px;
  border-radius: 8px;
  border: 3px solid transparent;
  cursor: pointer;
  font-weight: bold;
  text-align: center;
}

.green { background: #4CAF50; color: white; }
.red { background: #e74c3c; color: white; }
.blue { background: #5a6f8c; color: white; }
.none { background: #bdc3c7; }

.selected {
  border: 3px solid black;
}

button {
  width: 100%;
  padding: 16px;
  background: #2c3e50;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 17px;
  cursor: pointer;
}

.message {
  margin-top: 20px;
  font-weight: bold;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" class="logo" alt="Askerlia logo">
  <h1>Avstemning – Farge på bygget</h1>
  <p>Askerlia Boligsameie</p>
</header>

<div class="container">
  <p>Velg hvilken farge du ønsker at bygget skal males i:</p>
  <p class="deadline">Frist: 1. juni</p>

  <form id="voteForm">
    <label>Navn</label>
    <input type="text" id="navn" required>

    <label>E-post</label>
    <input type="email" id="epost" required>

    <label>Oppgang / Leilighet</label>
    <input type="text" id="leilighet" required>

    <label>Velg farge</label>
    <div class="color-options">
      <div class="color-btn green" onclick="selectColor('Grønn', this)">Grønn</div>
      <div class="color-btn red" onclick="selectColor('Rød', this)">Rød</div>
      <div class="color-btn blue" onclick="selectColor('Gråblå', this)">Gråblå</div>
      <div class="color-btn none" onclick="selectColor('Ingen av fargene', this)">Ingen av fargene</div>
    </div>

    <input type="hidden" id="fargevalg" required>

    <button type="submit">Send stemme</button>
  </form>

  <div id="message" class="message"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwGhidY9IJMExW07PHZ4kI1WYZTH95pZHZ9CuZQQrQjQiQVjn8a_GQhEFR1ibyka8I2/exec";

function selectColor(color, element) {
  document.getElementById("fargevalg").value = color;

  document.querySelectorAll(".color-btn").forEach(btn => {
    btn.classList.remove("selected");
  });

  element.classList.add("selected");
}

document.getElementById("voteForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    Navn: document.getElementById("navn").value,
    Epost: document.getElementById("epost").value,
    Leilighet: document.getElementById("leilighet").value,
    Fargevalg: document.getElementById("fargevalg").value
  };

  if (!data.Fargevalg) {
    document.getElementById("message").innerText = "Velg en farge før du sender.";
    return;
  }

  document.getElementById("message").innerText = "Sender stemme...";

  try {
    const response = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });

    const text = await response.text();

    if (text === "DUPLICATE") {
      document.getElementById("message").innerText = "Du har allerede stemt fra denne leiligheten.";
      return;
    }

    document.getElementById("voteForm").reset();
    document.querySelectorAll(".color-btn").forEach(btn => btn.classList.remove("selected"));
    document.getElementById("message").innerText = "Takk! Stemmen din er registrert.";

  } catch (error) {
    document.getElementById("message").innerText = "Noe gikk galt. Prøv igjen.";
  }
});
</script>

</body>
</html>
